services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: probe
      POSTGRES_PASSWORD: probe
      POSTGRES_DB: probe
    ports:
      - "127.0.0.1:${PROBE_DB_PORT:-5434}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U probe -d probe"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: postgres://probe:probe@db:5432/probe
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:${PROBE_BACKEND_PORT:-3210}:3000"
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
